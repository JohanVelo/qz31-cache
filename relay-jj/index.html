<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Velocity Relay</title>
<meta name="theme-color" content="#0A0A0F"><link rel="icon" href="icon.svg">
<style>
html,body{margin:0;height:100%;background:#0A0A0F;color:#E8E8F0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
.box{max-width:340px}
.glyph{font-size:34px;color:#FF3B5C;margin-bottom:12px}
#msg{font-size:17px;font-weight:600}
#sub{color:#A9A9BD;font-size:14px;line-height:1.6;margin:8px 0 18px}
#go{display:inline-block;color:#22D3EE;border:1px solid #22D3EE;border-radius:9px;padding:11px 20px;text-decoration:none;font-weight:600}
</style></head><body>
<div class="box"><div class="glyph">&#9822;</div><div id="msg">Opening Velocity Relay&hellip;</div><div id="sub">Velocity Relay has moved to a new address.</div><a id="go" href="../ticketapp/index.html">Open Velocity Relay</a></div>
<script>
/* Velocity Relay moved to ../ticketapp/. Keep the query and hash so a push tapped through an old
   relay-jj subscription (…#laptop, ?t=<id>) still lands on the right tab. Offline, or when this copy is
   served at any other path (an old service worker's cached copy), show the link instead of redirecting,
   so a cached copy can never loop. The link's href is set as a property: nothing from the URL becomes markup. */
(function(){
  var target='../ticketapp/index.html'+location.search+location.hash;
  document.getElementById('go').href=target;
  if(navigator.onLine===false||!/\/relay-jj(\/|$)/.test(location.pathname)){
    document.getElementById('msg').textContent='Velocity Relay';
    document.getElementById('sub').textContent=navigator.onLine===false?'You are offline. Tap below when you are back online.':'Tap below to open Velocity Relay.';
    return;
  }
  location.replace(target);
})();
</script></body></html>
